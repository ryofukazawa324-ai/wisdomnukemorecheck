<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識チェック</title><link rel="icon" type="image/png" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><link rel="apple-touch-icon" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fa;color:#21334a;max-width:920px;margin:auto;padding:16px}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px;margin:0 0 10px}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #c7d0df}button{background:#245eaa;color:white;border:0;cursor:pointer}button.subtle{background:#e7edf6;color:#243b56}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1;min-width:140px}.card{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #20354b0b}.person{border:1px solid #dbe3ef;border-radius:15px;padding:14px;margin:16px 0;background:#fff}.person-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.category{background:#f7f9fc;border:1px solid #e2e9f2;border-radius:12px;padding:12px;margin-top:12px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;align-items:center;gap:7px;padding:10px 0;border-top:1px solid #e2e9f2}.entry span{overflow-wrap:anywhere}.entry label{text-align:center;font-size:12px}.entry input{display:block;margin:5px auto 0;width:22px;height:22px}.entry button{padding:6px}.add{margin-top:10px}.muted{font-size:13px;color:#68788e}.hidden{display:none!important}#message{min-height:24px}#people{margin-top:12px}@media(max-width:530px){.entry{grid-template-columns:minmax(0,1fr) 65px 65px auto;gap:3px}.entry label{font-size:11px}.person{padding:10px}.category{padding:9px}button{padding:9px}}
textarea{width:100%;min-height:120px;resize:vertical;font:inherit;padding:12px;border:1px solid #c7d0df;border-radius:10px}#monthlyForm h3{margin-top:18px}</style><h1>知識の抜け漏れチェック</h1><div class="card" id="entry"><h2 id="modeTitle">部門を開く</h2><div class="row"><input id="code" inputmode="numeric" maxlength="3" placeholder="3桁数字" style="width:115px"><input id="dept" class="grow" placeholder="部門名"><button id="open">OK</button></div></div><div id="monthlyForm" class="card hidden"><h2>月一問診票</h2><p class="muted">わからないことを記入して送信してください。</p><form id="monthlySubmit"><div class="row"><label class="grow">店番号（3桁数字のみ）<input id="formStore" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" placeholder="例：123" required style="width:100%"></label><label class="grow">部門名<input id="formDept" placeholder="例：情報" required style="width:100%"><small class="muted">情報部門の場合は「情報」と入力</small></label><label class="grow">名前（姓名の間にスペースを入れない）<input id="formName" class="grow" placeholder="例：山田太郎" required style="width:100%"></label></div><h3>業務面でわからないこと</h3><textarea id="formOps" placeholder="複数ある場合は改行で区切って入力してください。"></textarea><h3>販買面でわからないこと</h3><textarea id="formSales" placeholder="複数ある場合は改行で区切って入力してください。"></textarea><p><button type="submit" id="formSend">回答を送信</button></p></form><p id="formResult" role="status"></p></div><div id="editor" class="hidden"><div class="card"><div class="row"><h2 class="grow" id="title"></h2><button id="share" class="adminonly">閲覧・チェック専用リンクをコピー</button><button id="monthlyLink" class="adminonly">月一問診票リンクをコピー</button><button id="viewAnswers" class="adminonly">問診票の回答一覧</button><span class="muted">操作確定時に自動保存</span></div><p class="muted" id="hint"></p><div class="row adminonly"><input id="person" class="grow" placeholder="新しい個人名"><button id="addperson">個人追加</button></div></div><div id="answers" class="card hidden"><div class="row"><h2 class="grow">月一問診票の回答一覧</h2><button id="refreshAnswers" class="subtle">再読み込み</button></div><p class="muted">確認した回答を承認すると個人別一覧に取り込みます。</p><div id="answerRows"></div></div><div id="people"></div></div><p id="message" role="status"></p><div id="conflictActions" class="card hidden"><p>別の更新と競合しました。現在の画面の内容を優先して保存できます。</p><button id="forceSave">現在の内容で上書き保存</button><button id="reloadLatest" class="subtle">最新データを読み込む</button></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const s=createClient('https://gwmwynjkhxaywknhakcw.supabase.co','sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q'),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),shared=params.get('share')==='1',monthly=params.get('form')==='monthly';let record=null,state=null,dirty=false,saving=false,queued=false,blocked=false;const msg=t=>$('message').textContent=t,esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=['業務面でわからないこと','販買面でわからないこと'];const norm=c=>c==='販売面でわからないこと'?cats[1]:(cats.includes(c)?c:cats[0]);function mark(){dirty=true;msg('自動保存待ち');void saveNow()}
async function open(){if(dirty&&!confirm('未保存の変更を破棄しますか？'))return;const code=$('code').value.trim(),department=$('dept').value.trim();if(!/^\d{3}$/.test(code)||!department)return msg('3桁数字と部門名を入力してください');msg('読み込み中…');let q=await s.from('wisdom_check_shared').select('*').eq('code',code).eq('department',department).maybeSingle();if(q.error)return msg(q.error.message);if(!q.data){if(shared)return msg('共有対象が見つかりません');q=await s.from('wisdom_check_shared').insert({code,department,data:{people:[]}}).select().single();if(q.error){if(q.error.code==='23505')return open();return msg(q.error.message)}}record=q.data;state=structuredClone(record.data);if(!Array.isArray(state.people))state.people=[];dirty=false;blocked=false;queued=false;$('conflictActions').classList.add('hidden');$('title').textContent=code+' / '+department;$('editor').classList.remove('hidden');render();if(!shared)void loadAnswers();msg('読み込み完了')}
$('open').onclick=open;
function render(){const root=$('people');root.innerHTML=state.people.map((p,pi)=>'<article class="person"><div class="person-head"><h2>'+esc(p.name)+'</h2>'+(shared?'':'<button class="subtle" data-remove-person="'+pi+'">個人削除</button>')+'</div>'+cats.map(cat=>'<div class="category"><h3>'+cat+'</h3>'+(p.items||[]).map((it,ii)=>({it,ii})).filter(x=>norm(x.it.category)===cat).map(({it,ii})=>'<div class="entry"><span>'+esc(it.name)+'</span><label>伝えられた<input type="checkbox" data-person="'+pi+'" data-item="'+ii+'" data-field="t" '+(it.t?'checked':'')+'></label><label>実践した<input type="checkbox" data-person="'+pi+'" data-item="'+ii+'" data-field="p" '+(it.p?'checked':'')+'></label>'+(shared?'':'<button class="subtle" data-remove-item="'+pi+':'+ii+'">×</button>')+'</div>').join('')+(shared?'':'<div class="row add"><input class="grow" data-input="'+pi+':'+cat+'" placeholder="わからないことを追加"><button data-add="'+pi+':'+cat+'">追加</button></div>')+'</div>').join('')+'<p class="muted">完了：'+(p.items||[]).filter(it=>it.t&&it.p).length+' / '+(p.items||[]).length+' 項目</p></article>').join('')||'<div class="card">まだ個人が登録されていません。</div>'}
$('addperson').onclick=()=>{const name=$('person').value.trim();if(!name)return;state.people.push({name,items:[]});$('person').value='';mark();render()};
$('people').onchange=e=>{const el=e.target;if(el.dataset.field!=='t'&&el.dataset.field!=='p')return;const it=state.people[+el.dataset.person]?.items?.[+el.dataset.item];if(!it)return;it[el.dataset.field]=el.checked;mark();render()};
$('people').onclick=e=>{const b=e.target.closest('button');if(!b||shared)return;if(b.dataset.add!==undefined){const [pi,cat]=b.dataset.add.split(':');const input=[...$('people').querySelectorAll('[data-input]')].find(x=>x.dataset.input===b.dataset.add);const name=input?.value.trim();if(!name)return;state.people[+pi].items.push({name,category:cat,t:false,p:false});mark();render()}else if(b.dataset.removeItem!==undefined){if(!confirm('項目を削除しますか？'))return;const [pi,ii]=b.dataset.removeItem.split(':').map(Number);state.people[pi].items.splice(ii,1);mark();render()}else if(b.dataset.removePerson!==undefined){if(!confirm('個人と全項目を削除しますか？'))return;state.people.splice(+b.dataset.removePerson,1);mark();render()}};
async function saveNow(){if(blocked||!record)return;if(saving){queued=true;return}saving=true;do{queued=false;const data=JSON.stringify(state);msg('保存中…');const result=await s.from('wisdom_check_shared').update({data:JSON.parse(data),updated_at:new Date().toISOString()}).eq('code',record.code).eq('department',record.department).eq('updated_at',record.updated_at).select();if(result.error||!result.data?.length){blocked=true;$('conflictActions').classList.remove('hidden');msg(result.error?'保存エラー: '+result.error.message:'更新競合を検出しました。上書き保存できます');break}record=result.data[0];dirty=JSON.stringify(state)!==data;msg(dirty?'次の変更を保存中':'自動保存完了')}while(dirty||queued);saving=false}
$('forceSave').onclick=async()=>{if(!record||!dirty)return;if(!confirm('他の端末で保存された内容を、現在表示している内容で上書きしますか？'))return;if(saving)return;saving=true;msg('優先保存中…');const snapshot=JSON.stringify(state);const r=await s.from('wisdom_check_shared').update({data:JSON.parse(snapshot),updated_at:new Date().toISOString()}).eq('code',record.code).eq('department',record.department).select();saving=false;if(r.error||!r.data?.length){msg('優先保存に失敗しました: '+(r.error?.message||'更新対象がありません'));return}record=r.data[0];blocked=false;$('conflictActions').classList.add('hidden');dirty=JSON.stringify(state)!==snapshot;msg('優先保存しました');if(dirty)void saveNow()};$('reloadLatest').onclick=async()=>{if(dirty&&!confirm('現在の未保存内容を破棄して最新データを読み込みますか？'))return;dirty=false;blocked=false;$('conflictActions').classList.add('hidden');await open()};
if(monthly){$('entry').classList.add('hidden');$('monthlyForm').classList.remove('hidden');$('formDept').value=params.get('dept')||'';$('formStore').value=params.get('code')||'';$('monthlySubmit').onsubmit=async e=>{e.preventDefault();const code=params.get('code')||'',dept=params.get('dept')||'';if(!/^\d{3}$/.test(code)||!dept)return $('formResult').textContent='無効な共有リンクです';const store=$('formStore').value.trim(),department=$('formDept').value.trim(),name=$('formName').value.replace(/[\s\u3000]+/g,'').trim();if(!/^\d{3}$/.test(store)||store!==code||department!==dept){$('formResult').textContent='店番号・部門名を共有先と一致させてください';return}if(!name)return;$('formSend').disabled=true;$('formResult').textContent='送信中…';const r=await s.from('wisdom_monthly_questionnaires').insert({workspace_code:code,workspace_department:dept,store_name:store,department_name:department,person_name:name,operations_questions:$('formOps').value.trim(),sales_questions:$('formSales').value.trim()});$('formSend').disabled=false;if(r.error){$('formResult').textContent='送信できませんでした: '+r.error.message;return}$('formResult').textContent='回答を送信しました。ありがとうございました。';$('monthlySubmit').reset();$('formDept').value=dept;$('formStore').value=code};}
if(shared&&!monthly){$('modeTitle').textContent='閲覧・チェック専用ページ';$('hint').textContent='項目の閲覧とチェックのみ可能です。チェックすると自動保存されます。';document.querySelectorAll('.adminonly').forEach(x=>x.remove());$('code').value=params.get('code')||'';$('dept').value=params.get('dept')||'';$('code').readOnly=true;$('dept').readOnly=true;if(/^\d{3}$/.test($('code').value)&&$('dept').value)open()}else if(!monthly){$('hint').textContent='個人ごとの2分類を一覧表示。追加・削除・チェックは確定時に自動保存されます。';$('share').onclick=async()=>{if(!record)return;const u=new URL(location.href);u.search='';u.searchParams.set('share','1');u.searchParams.set('code',record.code);u.searchParams.set('dept',record.department);try{await navigator.clipboard.writeText(u.href);msg('専用リンクをコピーしました')}catch{prompt('共有リンク',u.href)}}}
let answers=[];async function loadAnswers(){if(!record||shared||monthly)return;const r=await s.from('wisdom_monthly_questionnaires').select('*').eq('workspace_code',record.code).eq('workspace_department',record.department).order('submitted_at',{ascending:false});if(r.error){msg('回答取得エラー: '+r.error.message);return}answers=r.data||[];renderAnswers()}
function renderAnswers(){const root=$('answerRows');const pending=answers.filter(a=>a.review_status!=='approved');root.innerHTML=pending.length?pending.map(a=>'<div class="category"><div class="row"><strong class="grow">'+esc(a.person_name)+'</strong><span class="muted">'+esc(a.store_name)+' / '+esc(a.department_name)+' / '+new Date(a.submitted_at).toLocaleString('ja-JP')+'</span></div><h3>業務面でわからないこと</h3><p style="white-space:pre-wrap">'+esc(a.operations_questions||'なし')+'</p><h3>販買面でわからないこと</h3><p style="white-space:pre-wrap">'+esc(a.sales_questions||'なし')+'</p><button data-approve="'+esc(a.id)+'">確認して承認・一覧へ追加</button></div>').join(''):'<p>未承認の回答はありません。</p>';root.innerHTML+='<p class="muted">承認済み：'+answers.filter(a=>a.review_status==='approved').length+'件</p>'}
$('viewAnswers').onclick=async()=>{$('answers').classList.toggle('hidden');if(!$('answers').classList.contains('hidden'))await loadAnswers()};$('refreshAnswers').onclick=loadAnswers;
$('answerRows').onclick=async e=>{const btn=e.target.closest('[data-approve]');if(!btn||saving||blocked||dirty)return msg('保存中または未保存の変更があります。先に解消してください');const a=answers.find(x=>x.id===btn.dataset.approve);if(!a||!confirm(a.person_name+' さんの回答を承認して一覧に追加しますか？'))return;btn.disabled=true;const name=a.person_name.replace(/[\s\u3000]+/g,'').trim();let p=state.people.find(x=>x.name.replace(/[\s\u3000]+/g,'').trim()===name);if(!p){p={name,items:[]};state.people.push(p)}const additions=[{cat:cats[0],txt:a.operations_questions},{cat:cats[1],txt:a.sales_questions}];for(const item of additions){const values=(item.txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const value of values){if(!p.items.some(x=>x.name===value&&norm(x.category)===item.cat))p.items.push({name:value,category:item.cat,t:false,p:false})}}mark();render();while(saving)await new Promise(resolve=>setTimeout(resolve,100));if(blocked||dirty){btn.disabled=false;return msg('一覧の保存が未完了です。競合を解決後、再度承認してください')}const r=await s.from('wisdom_monthly_questionnaires').update({review_status:'approved'}).eq('id',a.id).select();if(r.error||!r.data?.length){btn.disabled=false;return msg('一覧へ追加しましたが承認状態の更新に失敗しました。再度確認してください')}a.review_status='approved';renderAnswers();msg('回答を承認して一覧に追加しました')};
if(!shared&&!monthly){$('monthlyLink').onclick=async()=>{if(!record)return;const u=new URL(location.href);u.search='';u.searchParams.set('form','monthly');u.searchParams.set('code',record.code);u.searchParams.set('dept',record.department);try{await navigator.clipboard.writeText(u.href);msg('月一問診票のリンクをコピーしました')}catch{prompt('月一問診票リンク',u.href)}}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></html>
