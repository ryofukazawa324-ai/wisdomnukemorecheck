<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識チェック</title><link rel="icon" type="image/png" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><link rel="apple-touch-icon" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fa;color:#21334a;max-width:920px;margin:auto;padding:16px}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px;margin:0 0 10px}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #c7d0df}button{background:#245eaa;color:white;border:0;cursor:pointer}button.subtle{background:#e7edf6;color:#243b56}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1;min-width:140px}.card{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #20354b0b}.person{border:1px solid #dbe3ef;border-radius:15px;padding:14px;margin:16px 0;background:#fff}.person-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.category{background:#f7f9fc;border:1px solid #e2e9f2;border-radius:12px;padding:12px;margin-top:12px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;align-items:center;gap:7px;padding:10px 0;border-top:1px solid #e2e9f2}.entry span{overflow-wrap:anywhere}.entry label{text-align:center;font-size:12px}.entry input{display:block;margin:5px auto 0;width:22px;height:22px}.entry button{padding:6px}.add{margin-top:10px}.muted{font-size:13px;color:#68788e}.hidden{display:none!important}#message{min-height:24px}#people{margin-top:12px}@media(max-width:530px){.entry{grid-template-columns:minmax(0,1fr) 65px 65px auto;gap:3px}.entry label{font-size:11px}.person{padding:10px}.category{padding:9px}button{padding:9px}}
</style><h1>知識の抜け漏れチェック</h1><div class="card" id="entry"><h2 id="modeTitle">部門を開く</h2><div class="row"><input id="code" inputmode="numeric" maxlength="3" placeholder="3桁数字" style="width:115px"><input id="dept" class="grow" placeholder="部門名"><button id="open">OK</button></div></div><div id="editor" class="hidden"><div class="card"><div class="row"><h2 class="grow" id="title"></h2><button id="share" class="adminonly">閲覧・チェック専用リンクをコピー</button><button id="save">変更を保存</button></div><p class="muted" id="hint"></p><div class="row adminonly"><input id="person" class="grow" placeholder="新しい個人名"><button id="addperson">個人追加</button></div></div><div id="people"></div></div><p id="message" role="status"></p>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const s=createClient('https://gwmwynjkhxaywknhakcw.supabase.co','sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q'),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),shared=params.get('share')==='1';let record=null,state=null,dirty=false;const msg=t=>$('message').textContent=t,esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cats=['業務面でわからないこと','販買面でわからないこと'];const norm=c=>c==='販売面でわからないこと'?cats[1]:(cats.includes(c)?c:cats[0]);function mark(){dirty=true;msg('未保存の変更があります')}
async function open(){if(dirty&&!confirm('未保存の変更を破棄しますか？'))return;const code=$('code').value.trim(),department=$('dept').value.trim();if(!/^\d{3}$/.test(code)||!department)return msg('3桁数字と部門名を入力してください');msg('読み込み中…');let q=await s.from('wisdom_check_shared').select('*').eq('code',code).eq('department',department).maybeSingle();if(q.error)return msg(q.error.message);if(!q.data){if(shared)return msg('共有対象が見つかりません');q=await s.from('wisdom_check_shared').insert({code,department,data:{people:[]}}).select().single();if(q.error){if(q.error.code==='23505')return open();return msg(q.error.message)}}record=q.data;state=structuredClone(record.data);if(!Array.isArray(state.people))state.people=[];dirty=false;$('title').textContent=code+' / '+department;$('editor').classList.remove('hidden');render();msg('読み込み完了')}
$('open').onclick=open;
function render(){const root=$('people');root.innerHTML=state.people.map((p,pi)=>'<article class="person"><div class="person-head"><h2>'+esc(p.name)+'</h2>'+(shared?'':'<button class="subtle" data-remove-person="'+pi+'">個人削除</button>')+'</div>'+cats.map(cat=>'<div class="category"><h3>'+cat+'</h3>'+(p.items||[]).map((it,ii)=>({it,ii})).filter(x=>norm(x.it.category)===cat).map(({it,ii})=>'<div class="entry"><span>'+esc(it.name)+'</span><label>伝えられた<input type="checkbox" data-person="'+pi+'" data-item="'+ii+'" data-field="t" '+(it.t?'checked':'')+'></label><label>実践した<input type="checkbox" data-person="'+pi+'" data-item="'+ii+'" data-field="p" '+(it.p?'checked':'')+'></label>'+(shared?'':'<button class="subtle" data-remove-item="'+pi+':'+ii+'">×</button>')+'</div>').join('')+(shared?'':'<div class="row add"><input class="grow" data-input="'+pi+':'+cat+'" placeholder="わからないことを追加"><button data-add="'+pi+':'+cat+'">追加</button></div>')+'</div>').join('')+'<p class="muted">完了：'+(p.items||[]).filter(it=>it.t&&it.p).length+' / '+(p.items||[]).length+' 項目</p></article>').join('')||'<div class="card">まだ個人が登録されていません。</div>'}
$('addperson').onclick=()=>{const name=$('person').value.trim();if(!name)return;state.people.push({name,items:[]});$('person').value='';mark();render()};
$('people').onchange=e=>{const el=e.target;if(el.dataset.field!=='t'&&el.dataset.field!=='p')return;const it=state.people[+el.dataset.person]?.items?.[+el.dataset.item];if(!it)return;it[el.dataset.field]=el.checked;mark();render()};
$('people').onclick=e=>{const b=e.target.closest('button');if(!b||shared)return;if(b.dataset.add!==undefined){const [pi,cat]=b.dataset.add.split(':');const input=[...$('people').querySelectorAll('[data-input]')].find(x=>x.dataset.input===b.dataset.add);const name=input?.value.trim();if(!name)return;state.people[+pi].items.push({name,category:cat,t:false,p:false});mark();render()}else if(b.dataset.removeItem!==undefined){if(!confirm('項目を削除しますか？'))return;const [pi,ii]=b.dataset.removeItem.split(':').map(Number);state.people[pi].items.splice(ii,1);mark();render()}else if(b.dataset.removePerson!==undefined){if(!confirm('個人と全項目を削除しますか？'))return;state.people.splice(+b.dataset.removePerson,1);mark();render()}};
$('save').onclick=async()=>{if(!dirty)return msg('変更はありません');msg('保存中…');const r=await s.from('wisdom_check_shared').update({data:state,updated_at:new Date().toISOString()}).eq('code',record.code).eq('department',record.department).eq('updated_at',record.updated_at).select();if(r.error)return msg('保存失敗: '+r.error.message);if(!r.data.length)return msg('別端末で更新されています。上書きを中止しました。再読み込み前に変更内容を控えてください');record=r.data[0];dirty=false;msg('Supabaseに保存しました')};
if(shared){$('modeTitle').textContent='閲覧・チェック専用ページ';$('hint').textContent='項目の閲覧とチェックのみ可能です。チェック後に「変更を保存」を押してください。';document.querySelectorAll('.adminonly').forEach(x=>x.remove());$('code').value=params.get('code')||'';$('dept').value=params.get('dept')||'';$('code').readOnly=true;$('dept').readOnly=true;if(/^\d{3}$/.test($('code').value)&&$('dept').value)open()}else{$('hint').textContent='個人ごとの2分類を一覧表示。追加・削除・チェック後に保存してください。';$('share').onclick=async()=>{if(!record)return;const u=new URL(location.href);u.search='';u.searchParams.set('share','1');u.searchParams.set('code',record.code);u.searchParams.set('dept',record.department);try{await navigator.clipboard.writeText(u.href);msg('専用リンクをコピーしました')}catch{prompt('共有リンク',u.href)}}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></html>
