<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識チェック</title><link rel="icon" type="image/png" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><link rel="apple-touch-icon" href="./84F7DD69-6796-4CDB-9A6E-59E590F74796.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{font-family:system-ui;background:#f3f6fb;color:#24334a;max-width:800px;margin:auto;padding:18px}section{background:white;border-radius:15px;padding:20px;margin:15px 0}input,button,select{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #bbb}button{background:#245eaa;color:white}li{padding:9px;border-bottom:1px solid #ddd}input[type=checkbox]{width:20px;height:20px}.hidden{display:none}</style><h1>知識の抜け漏れチェック</h1><section id="auth"><h2>メールでログイン</h2><input id="email" type="email" placeholder="メール"><input id="pw" type="password" placeholder="パスワード"><button id="login">ログイン</button><button id="signup">新規登録</button></section><section id="main" class="hidden"><button id="logout">ログアウト</button><h2>部門を開く</h2><input id="code" maxlength="3" placeholder="3桁数字"><input id="dept" placeholder="部門名"><button id="open">OK</button><div id="editor" class="hidden"><h2 id="title"></h2><select id="people"></select><input id="person" placeholder="個人名"><button id="addperson">個人追加</button><button id="delperson">個人削除</button><p id="progress"></p><div id="items"></div><input id="item" placeholder="知識項目"><button id="additem">項目追加</button><p><button id="save">変更を保存</button></p></div></section><p id="message"></p><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const s=createClient('https://gwmwynjkhxaywknhakcw.supabase.co','sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q',{auth:{storage:sessionStorage}}),$=id=>document.getElementById(id);let user,record,state,selected=0,dirty=false;const msg=t=>$('message').textContent=t;const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function auth(){user=(await s.auth.getUser()).data.user;$('auth').classList.toggle('hidden',!!user);$('main').classList.toggle('hidden',!user)}
$('login').onclick=async()=>{let r=await s.auth.signInWithPassword({email:$('email').value,password:$('pw').value});msg(r.error?.message||'ログイン完了');await auth()};
$('signup').onclick=async()=>{let r=await s.auth.signUp({email:$('email').value,password:$('pw').value});msg(r.error?.message||'確認メールを確認してください');await auth()};
$('logout').onclick=async()=>{await s.auth.signOut();await auth()};
$('open').onclick=async()=>{if(dirty&&!confirm('未保存の変更を破棄しますか？'))return;let code=$('code').value,department=$('dept').value.trim();if(!/^\d{3}$/.test(code)||!department)return msg('3桁数字と部門名を入力してください');let q=await s.from('wisdom_check_workspaces').select('*').eq('owner_id',user.id).eq('code',code).eq('department',department).maybeSingle();if(q.error)return msg(q.error.message);if(!q.data)q=await s.from('wisdom_check_workspaces').insert({owner_id:user.id,code,department,data:{people:[]}}).select().single();if(q.error)return msg(q.error.message);record=q.data;state=structuredClone(record.data);selected=0;dirty=false;$('editor').classList.remove('hidden');$('title').textContent=code+' / '+department;render();msg('読み込み完了')};
function render(){let p=state.people;$('people').innerHTML=p.map((v,i)=>'<option value="'+i+'">'+esc(v.name)+'</option>').join('');$('people').value=selected;let person=p[selected];$('items').innerHTML=person?person.items.map((v,i)=>'<li><span>'+esc(v.name)+'</span>　<label>伝えられた<input type="checkbox" data-i="'+i+'" data-f="t" '+(v.t?'checked':'')+'></label> <label>実践した<input type="checkbox" data-i="'+i+'" data-f="p" '+(v.p?'checked':'')+'></label><button data-del="'+i+'">削除</button></li>').join(''):'';$('progress').textContent=person?person.items.filter(x=>x.t&&x.p).length+' / '+person.items.length+' 項目完了':'個人を追加してください'}
$('people').onchange=()=>{selected=+$('people').value;render()};
$('addperson').onclick=()=>{let name=$('person').value.trim();if(!name)return;state.people.push({name,items:[]});selected=state.people.length-1;$('person').value='';dirty=true;render()};
$('delperson').onclick=()=>{if(!state.people.length||!confirm('個人を削除しますか？'))return;state.people.splice(selected,1);selected=0;dirty=true;render()};
$('additem').onclick=()=>{let name=$('item').value.trim();if(!name||!state.people[selected])return;state.people[selected].items.push({name,t:false,p:false});$('item').value='';dirty=true;render()};
$('items').onchange=e=>{let i=+e.target.dataset.i,f=e.target.dataset.f;if(!['t','p'].includes(f))return;state.people[selected].items[i][f]=e.target.checked;dirty=true;render()};
$('items').onclick=e=>{let i=e.target.dataset.del;if(i===undefined||!confirm('項目を削除しますか？'))return;state.people[selected].items.splice(+i,1);dirty=true;render()};
$('save').onclick=async()=>{if(!dirty)return msg('変更はありません');let r=await s.from('wisdom_check_workspaces').update({data:state,updated_at:new Date().toISOString()}).eq('id',record.id).eq('owner_id',user.id).eq('updated_at',record.updated_at).select();if(r.error)return msg(r.error.message);if(!r.data.length)return msg('別端末で変更済みです。上書きを停止しました');record=r.data[0];dirty=false;msg('保存しました')};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};await auth();
</script></html>
